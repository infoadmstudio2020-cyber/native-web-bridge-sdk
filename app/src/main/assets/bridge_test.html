<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeWebBridge Test Page</title>
    <style>
        body { background: #161B22; color: #F0F6FC; font-family: monospace; padding: 12px; margin: 0; }
        h3 { color: #00E5FF; margin-top: 0; }
        button { background: #21262D; border: 1px solid #30363D; color: #00E5FF; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-right: 6px; margin-bottom: 6px; font-weight: bold; }
        button:active { background: #30363D; }
        #log { background: #0D1117; border: 1px solid #30363D; padding: 8px; border-radius: 4px; min-height: 120px; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <h3>NativeWebBridge HTML Test</h3>
    <div>
        <button onclick="testPing()">Ping Native</button>
        <button onclick="testEcho()">Call Echo RPC</button>
        <button onclick="testDiagnostic()">Call Diagnostic RPC</button>
        <button onclick="clearLog()">Clear</button>
    </div>
    <div id="log">Ready. Waiting for bridge actions...</div>

    <script>
        function log(msg) {
            var el = document.getElementById('log');
            el.innerText = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n' + el.innerText;
        }
        function clearLog() { document.getElementById('log').innerText = ''; }

        function testPing() {
            if (window.NativeBridgeClient) {
                var pong = window.NativeBridgeClient.ping();
                log('Ping returned: ' + pong);
            } else {
                log('NativeBridgeClient not available');
            }
        }

        function testEcho() {
            if (window.NativeBridgeClient) {
                log('Calling /echo with payload...');
                window.NativeBridgeClient.call('echo', { message: 'Hello from WebView JS!', time: Date.now() })
                    .then(function(res) {
                        log('Echo Success: ' + JSON.stringify(res));
                    }).catch(function(err) {
                        log('Echo Error: ' + err.message);
                    });
            } else {
                log('NativeBridgeClient not available');
            }
        }

        function testDiagnostic() {
            if (window.NativeBridgeClient) {
                log('Calling /diagnostic RPC...');
                window.NativeBridgeClient.call('diagnostic', { scope: 'full' })
                    .then(function(res) {
                        log('Diagnostic Success: ' + JSON.stringify(res));
                    }).catch(function(err) {
                        log('Diagnostic Error: ' + err.message);
                    });
            } else {
                log('NativeBridgeClient not available');
            }
        }

        if (window.NativeBridgeClient) {
            window.NativeBridgeClient.on('system_status', function(data) {
                log('Received Event [system_status]: ' + JSON.stringify(data));
            });
        }
    </script>
</body>
</html>
